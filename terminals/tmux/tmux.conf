# Keep every command truecolor so Flexoki hex values render exactly.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Tc"

# ############################################
# #                 GENERAL                 #
# ############################################

set -g base-index 1 # Start windows at 1.
set -g pane-base-index 1 # Start panes at 1.
set -g renumber-windows on # Close gaps in window numbers after a window closes.
set -g history-limit 100000 # Deep scrollback, matching the terminal configs.
set -g display-time 750 # Match the terminal resize-overlay duration.
set -g escape-time 10 # Send Escape immediately instead of waiting for a sequence.
set -g focus-events on # Forward focus events to applications.
set -g mouse on # Enable mouse selection, resizing, and scrolling.
set -g set-clipboard on # Use the terminal clipboard (OSC 52) for yanks.
set -g default-command "zsh -l" # Start new panes in a login zsh.

# Reload this file with prefix + r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# ############################################
# #                  PANES                  #
# ############################################

bind | split-window -h -c "#{pane_current_path}" # Split horizontally.
bind - split-window -v -c "#{pane_current_path}" # Split vertically.
unbind '"'
unbind %
bind h select-pane -L # Move between panes without the arrow keys.
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5 # Repeatable resize steps.
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# VS Code-style keys, usable without the prefix. They coexist with the vim
# bindings above: Ctrl+Shift+arrows move focus, Alt+Shift+arrows resize.
bind -n C-S-Left select-pane -L
bind -n C-S-Down select-pane -D
bind -n C-S-Up select-pane -U
bind -n C-S-Right select-pane -R
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Right resize-pane -R 5

# ############################################
# #                COPY MODE                #
# ############################################

setw -g mode-keys vi # Vi-style navigation, matching nvim here.
bind -T copy-mode-vi v send -X begin-selection # Start a selection.
bind -T copy-mode-vi V send -X select-line # Select the current line.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy" # Yank to the clipboard.
bind -T copy-mode-vi Escape send -X cancel # Leave copy mode.

# ############################################
# #                  THEME                  #
# ############################################

# Flexoki (https://stephango.com/flexoki), matching WezTerm, Ghostty, and Konsole.
# `client_theme` reports light/dark from the terminal's OSC 11 once a client attaches.

%if "#{==:#{client_theme},light}"
set -g @flexoki_bg "#FFFCF0" # Background
set -g @flexoki_fg "#100F0F" # Foreground
set -g @flexoki_surface "#E6E4D9" # Status background
set -g @flexoki_accent "#24837B" # Cyan
set -g @flexoki_muted "#B7B5AC" # Dim text
%else
set -g @flexoki_bg "#100F0F"
set -g @flexoki_fg "#CECDC3"
set -g @flexoki_surface "#282726"
set -g @flexoki_accent "#3AA99F"
set -g @flexoki_muted "#575653"
%endif

set -g status-style "bg=#{@flexoki_surface},fg=#{@flexoki_fg}"
set -g status-left "#[bold,fg=#{@flexoki_accent}]#S #[nobold,fg=#{@flexoki_muted}]| "
set -g status-left-length 40
set -g status-right "#[fg=#{@flexoki_muted}]#{pane_current_path} #[fg=#{@flexoki_accent}]| #[fg=#{@flexoki_fg}]%H:%M "
set -g status-right-length 80
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold,bg=#{@flexoki_accent},fg=#{@flexoki_bg}] #I:#W #[default] "
set -g window-status-separator ""
set -g pane-border-style "fg=#{@flexoki_muted}"
set -g pane-active-border-style "fg=#{@flexoki_accent}"
set -g message-style "bg=#{@flexoki_surface},fg=#{@flexoki_fg}"
set -g mode-style "bg=#{@flexoki_accent},fg=#{@flexoki_bg}"

# Re-evaluate the theme when the client's appearance changes.
set-hook -g client-attached "source-file ~/.config/tmux/tmux.conf"
set-hook -g client-session-changed "source-file ~/.config/tmux/tmux.conf"