# Contour terminal configuration.
# Kept minimal; values mirror the preferences used in the other terminals.
# Full option reference: https://contour-terminal.org/configuration/

# Auto-detect the platform plugin (cocoa on macOS, xcb on Linux, etc.).
platform_plugin: auto

default_profile: main

profiles:
  main:
    # No shell override: Contour uses the user's default login shell,
    # which keeps this config portable across macOS (/bin/zsh) and
    # Linux (/usr/bin/zsh).
    initial_working_directory: "~"
    # No-op outside Flatpak; escapes the sandbox on Linux Flatpak installs.
    escape_sandbox: true

    # Native server-side window decorations (real title bar).
    show_title_bar: true

    # Open new windows maximized, like the previous terminals.
    maximized: true

    # Quiet the bell; skips Qt Multimedia init (audio probe) at startup.
    bell:
      sound: "off"

    # Keep a large scrollback history.
    history:
      limit: 50000
      auto_scroll_on_update: true
      scroll_multiplier: 3

    scrollbar:
      position: Hidden

    mouse:
      hide_while_typing: true

    # Window padding, in pixels.
    margins:
      horizontal: 12
      vertical: 12

    font:
      size: 10
      locator: Native
      render_mode: LCD  # subpixel rendering; Gray softens Iosevka's thin stems
      strict_spacing: false
      builtin_box_drawing: true  # pixel-perfect box drawing / block glyphs
      max_fallback_count: 4  # few fallbacks: Nerd Font variants mismatched Iosevka's metrics
      text_shaping:
        engine: harfbuzz
      regular:
        family: "Iosevka Extended"
        weight: Regular
        slant: Normal
        # Nerd Font glyphs missing from the primary font.
        fallback:
          - "Symbols Nerd Font"
      bold:
        family: "Iosevka Extended"
        weight: Bold
        fallback:
          - "Symbols Nerd Font"

    # Follow the system dark/light appearance.
    colors:
      dark: github-dark-default
      light: github-light-default

    # Hide the VT indicator status line (stats, clock, title, tabs).
    status_line:
      display: none

color_schemes:
  # GitHub Dark Default, from github-nvim-theme (Primer ansi palette).
  github-dark-default:
    default:
      background: "#0d1117"
      foreground: "#e6edf3"
      bright_foreground: "#ffffff"
      dimmed_foreground: "#848d97"
    normal:
      black: "#484f58"
      red: "#ff7b72"
      green: "#3fb950"
      yellow: "#d29922"
      blue: "#58a6ff"
      magenta: "#bc8cff"
      cyan: "#39c5cf"
      white: "#b1bac4"
    bright:
      black: "#6e7681"
      red: "#ffa198"
      green: "#56d364"
      yellow: "#e3b341"
      blue: "#79c0ff"
      magenta: "#d2a8ff"
      cyan: "#56d4dd"
      white: "#ffffff"
  # GitHub Light Default, from github-nvim-theme (Primer ansi palette).
  github-light-default:
