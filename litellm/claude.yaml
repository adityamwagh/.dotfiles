# LiteLLM Anthropic Messages proxy for LithosAI (port 4001)
#
# Claude Code only speaks the Anthropic Messages API and LithosAI only serves
# Chat Completions, so `lithos-claude` runs this proxy in front of LithosAI.
# The hosted_vllm/ prefix is required: it translates /v1/messages requests into
# Chat Completions calls. See https://docs.lithosai.com/agent-integrations/claude-code
#
# Model list and context/output limits mirror opencode/opencode.json.
# API key comes from $LITHOSAI_API_KEY (e.g. via ~/.env).

model_list:
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: hosted_vllm/deepseek-ai/DeepSeek-V4.1-Flash
      api_base: https://api.lithosai.cloud/v1
      api_key: os.environ/LITHOSAI_API_KEY
  - model_name: deepseek-v4.1-flash-fast
    litellm_params:
      model: hosted_vllm/deepseek-ai/DeepSeek-V4.1-Flash-fast
