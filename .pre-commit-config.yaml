repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-format
        exclude: '^dot_claude/|^dot_config/zed/empty_tasks\.json$' # app-owned / empty file

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v0.20.0
    hooks:
      - id: stylua

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent, "2", --case-indent, --language-dialect, bash]
        types: [text]
        files: '^(dot_bashrc|dot_bash_profile|dot_profile)$|^dot_local/bin/'

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-s, bash, --severity=warning]
        types: [text]
        files: '^(dot_bashrc|dot_bash_profile|dot_profile)$|^dot_local/bin/'

  - repo: local
    hooks:
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: system
        types: [yaml]
