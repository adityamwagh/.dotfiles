repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: oxfmt
        language: system
        types: [text]
        files: '\.(c|m)?(js|ts)x?$|\.json[c5]?$|\.ya?ml$|\.toml$|\.(md|mdx|css|scss|less|html|vue|svelte|graphql|gql)$'
        exclude: "^claude/" # Claude Code re-serializes its own settings
      - id: oxlint
        name: oxlint
        entry: oxlint
        language: system
        types: [text]
        files: '\.(c|m)?(js|ts)x?$'

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v0.20.0
    hooks:
      - id: stylua

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent, "2", --case-indent]
        exclude: 'shells/zsh/\.'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: 'shells/zsh/\.' # zsh syntax is not supported by shellcheck
