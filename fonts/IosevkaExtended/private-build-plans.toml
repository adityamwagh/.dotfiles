# Iosevka custom build plan: "Iosevka Extended".
# term spacing, sans serifs, no ligatures (noLigation), no ss09 variants.
# One width -- the 600-unit geometry -- so the family name is simply
# "Iosevka Extended" with no width token (selectable by name in every app,
# including VS Code/Chromium, which keys off the typographic family name).
# 4 weights (Regular/Medium/SemiBold/Bold) x 1 width x upright = 4 TTF files.
# Regenerate with scripts/build-custom-iosevka-extended.sh (Docker).
# Options reference: https://github.com/be5invis/Iosevka/blob/master/doc/custom-build.md

[buildPlans.IosevkaExtended]
family = "Iosevka Extended" # menu family; filenames become IosevkaExtended-<Weight>.ttf
spacing = "term"            # normal | term | fontconfig-mono | fixed
serifs = "sans"             # sans | slab
noCvSs = false              # keep cv##/ss## OpenType features available
exportGlyphNames = true     # needed for ligature support in Kitty
noLigation = true           # disable ligations entirely

# Explicit weights: shapes map to the usual four grades.
[buildPlans.IosevkaExtended.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaExtended.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaExtended.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaExtended.weights.SemiBold]
shape = 600
menu = 600
css = 600

# Single width carrying the 600-unit geometry. Keyed `Normal` (the default width
# slot) on purpose so no width token is appended to the family name: shape = 600
# gives the extended glyphs while the family stays "Iosevka Extended".
[buildPlans.IosevkaExtended.widths.Normal]
shape = 600    # extended geometry; unit width in 1/1000 em (500 = normal)
menu = 5       # default width grade -> no width token in font names
css = "normal"

# Defining a slopes block restricts output to the slopes listed, so this yields
# upright only (no Italic, no Oblique).
[buildPlans.IosevkaExtended.slopes.Upright]
angle = 0         # degrees, valid range [0, 15]
shape = "upright" # slope used for variant selection
menu = "upright"  # slope grade used in font names
css = "normal"    # webfont font-style