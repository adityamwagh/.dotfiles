# Claude Code statusline rendered by cship (https://github.com/stephenleo/cship).
# Named ANSI colors only, so the terminal palette themes dark/light automatically.

[cship]
# One token per module across four rows. Row 1 identity and workspace, row 2
# tokens, row 3 cost and diffstat, row 4 limits and account.
lines = [
  "$directory$git_branch$git_status$cship.model $cship.agent $cship.effort $cship.vim $cship.session $cship.workspace",
  "$cship.context_bar $cship.context_window $cship.context_window.used_percentage $cship.context_window.remaining_percentage $cship.context_window.size $cship.context_window.used_tokens $cship.context_window.total_input_tokens $cship.context_window.total_output_tokens $cship.context_window.current_usage_input_tokens $cship.context_window.current_usage_output_tokens $cship.context_window.current_usage_cache_read_input_tokens $cship.context_window.current_usage_cache_creation_input_tokens",
  "$cship.cost $cship.cost.total_duration $cship.cost.total_api_duration $cship.cost.total_lines_added $cship.cost.total_lines_removed",
  "$cship.usage_limits $cship.usage_limits.per_model $cship.account $cship.peak_usage",
]

[cship.model]
symbol = "🤖 "              # Icon before the model name.
style = "bold blue"        # Match the starship claude_model style.
haiku_style = "green"      # Haiku-family model name color.
sonnet_style = "bold blue" # Sonnet-family model name color.
opus_style = "magenta"     # Opus-family model name color.

[cship.agent]
symbol = "↳ "        # Prefix for the active sub-agent name.
style = "fg:#9ece6a" # Agent name color.

[cship.effort]
symbol = "⚡ "               # Prefix for the reasoning effort level.
style = "dim"               # Fallback effort style.
low_style = "cyan"          # Style when effort is low.
medium_style = "white"      # Style when effort is medium.
high_style = "yellow"       # Style when effort is high.
xhigh_style = "bold yellow" # Style when effort is xhigh.
max_style = "bold red"      # Style when effort is max.

[cship.vim]
normal_style = "bold green" # Vim mode style in NORMAL.
insert_style = "bold blue"  # Vim mode style in INSERT.

[cship.session]
symbol = "session:" # Prefix before the session identifier.
style = "dim"       # Session identifier style.

[cship.workspace]
symbol = "ws:"     # Prefix before the workspace directory.
style = "dim cyan" # Workspace directory style.

[cship.context_bar]
width = 10                  # Gauge width in characters.
filled_char = "█"           # Filled gauge segment.
empty_char = "░"            # Empty gauge segment.
style = "green"             # Healthy context usage.
warn_threshold = 70.0       # Warn once context passes 70%.
warn_style = "yellow"       # Warning gauge color.
critical_threshold = 90.0   # Critical once context passes 90%.
critical_style = "bold red" # Critical gauge color.
empty_style = "dim"         # Gauge style before any context data.

[cship.context_window]
style = "white" # Fallback context window style.

[cship.context_window.used_percentage]
format = "[$symbol$value%]($style)" # Render the used percentage.
symbol = "used:"                    # Label before the percentage.
style = "cyan"                      # Used percentage style.
warn_threshold = 70.0               # Warn once usage passes 70%.
warn_style = "yellow"               # Warning color.
critical_threshold = 90.0           # Critical once usage passes 90%.
critical_style = "bold red"         # Critical color.

[cship.context_window.remaining_percentage]
format = "[$symbol$value%]($style)" # Render the remaining percentage.
symbol = "rem:"                     # Label before the percentage.
style = "cyan"                      # Remaining percentage style.
warn_threshold = 30.0               # Warn once remaining falls below 30%.
warn_style = "yellow"               # Warning color.
critical_threshold = 10.0           # Critical once remaining falls below 10%.
critical_style = "bold red"         # Critical color.
invert_threshold = true             # Low remaining is the bad direction.

[cship.context_window.size]
format = "[$symbol$value]($style)" # Render the context window size.
symbol = "size:"                   # Label before the size.
style = "dim white"                # Size style.

[cship.context_window.used_tokens]
style = "cyan"              # Used/total token summary style.
warn_threshold = 70.0       # Warn once context passes 70%.
warn_style = "yellow"       # Warning summary color.
critical_threshold = 90.0   # Critical once context passes 90%.
critical_style = "bold red" # Critical summary color.

[cship.context_window.total_input_tokens]
format = "[$symbol$value]($style)" # Render input tokens in context.
symbol = "in:"                     # Label before the input token count.
style = "white"                    # Input token style.

[cship.context_window.total_output_tokens]
format = "[$symbol$value]($style)" # Render output tokens in context.
symbol = "out:"                    # Label before the output token count.
style = "white"                    # Output token style.

[cship.context_window.current_usage_input_tokens]
format = "[$symbol$value]($style)" # Render current-turn input tokens.
symbol = "turn-in:"                # Label before the input token count.
style = "dim white"                # Input token style.

[cship.context_window.current_usage_output_tokens]
format = "[$symbol$value]($style)" # Render current-turn output tokens.
symbol = "turn-out:"               # Label before the output token count.
style = "dim white"                # Output token style.

[cship.context_window.current_usage_cache_read_input_tokens]
format = "[$symbol$value]($style)" # Render cache read tokens.
symbol = "cache-r:"                # Label before the cache read count.
style = "green"                    # Cache read token style.

[cship.context_window.current_usage_cache_creation_input_tokens]
format = "[$symbol$value]($style)" # Render cache creation tokens.
symbol = "cache-w:"                # Label before the cache write count.
style = "yellow"                   # Cache creation token style.

[cship.cost]
symbol = "💰 "               # Icon before the session cost.
style = "green"             # Healthy cost style.
warn_threshold = 5.0        # Warn once the session passes $5.
warn_style = "yellow"       # Warning cost color.
critical_threshold = 10.0   # Critical once the session passes $10.
critical_style = "bold red" # Critical cost color.
currency_symbol = "$"       # Display currency symbol.
conversion_rate = 1.0       # Multiplier applied to the USD cost.

[cship.cost.total_duration]
format = "[$symbol$value]($style)" # Render total wall-clock duration.
symbol = "wall:"                   # Label before the duration.
style = "dim white"                # Duration style.

[cship.cost.total_api_duration]
format = "[$symbol$value]($style)" # Render total API duration.
symbol = "api:"                    # Label before the duration.
style = "dim white"                # Duration style.

[cship.cost.total_lines_added]
format = "[$symbol$value]($style)" # Render lines added this session.
symbol = "+"                       # Diffstat-style prefix.
style = "green"                    # Lines-added color.

[cship.cost.total_lines_removed]
format = "[$symbol$value]($style)" # Render lines removed this session.
symbol = "-"                       # Diffstat-style prefix.
style = "red"                      # Lines-removed color.

[cship.usage_limits]
five_hour_format = "5h {pct}% ({reset})"                        # 5-hour window usage and reset time.
seven_day_format = "7d {pct}% ({reset})"                        # 7-day window usage and reset time.
opus_format = "opus {pct}%"                                     # 7-day Opus utilization section.
sonnet_format = "sonnet {pct}%"                                 # 7-day Sonnet utilization section.
cowork_format = "cowork {pct}%"                                 # 7-day Cowork utilization section.
oauth_apps_format = "oauth {pct}%"                              # 7-day OAuth-apps utilization section.
extra_usage_format = "{active} extra {pct}% (${used}/${limit})" # Extra-credit section.
show_per_model = true                                           # Include the per-model breakdown.
separator = " "                                                 # Space between sections.
bar_width = 10                                                  # Width of the {bar} placeholder.
bar_filled_char = "█"                                           # Filled bar segment.
bar_empty_char = "░"                                            # Empty bar segment.
style = "cyan"                                                  # Healthy usage style.
warn_threshold = 70.0                                           # Warn once a window passes 70%.
warn_style = "yellow"                                           # Warning usage color.
critical_threshold = 90.0                                       # Critical once a window passes 90%.
critical_style = "bold red"                                     # Critical usage color.

[cship.account]
symbol = "👤 "             # Prefix before the account label.
style = "bold fg:#7aa2f7" # Account label style.
format = "{label}"        # Show the resolved account label.

[cship.peak_usage]
symbol = "⏰ "        # Prefix for the peak-time indicator.
style = "fg:#e0af68" # Peak-time indicator color.
start_hour = 7       # Peak window start, US Pacific.
end_hour = 17        # Peak window end, US Pacific.
