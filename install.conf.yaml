- defaults:
    link:
      create: true
      relink: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: # Remove stale dotfile symlinks.
    ~/: # Clean top-level dotfile links.
      recursive: false # Do not scan home recursively.
      force: false # Only clean links into this repo.
    ~/.claude: # Clean Claude Code config links.
      recursive: false
      force: false
    ~/.config: # Clean direct config links.
      recursive: false # Avoid scanning app internals.
      force: false # Preserve non-dotfile broken links.
    ~/.config/opencode: # Clean OpenCode config links.
      recursive: false
      force: false
    ~/.config/contour: # Clean Contour config link (native layout).
      recursive: false
      force: false
    ~/.var/app/org.contourterminal.Contour/config/contour: # Clean Contour config link (Flatpak).
      recursive: false
      force: false
    ~/Library/Application Support/contour: # Clean Contour config link (macOS).
      recursive: false
      force: false
    ~/.config/nvim:
      recursive: false
      force: false
    ~/.config/tmux:
      recursive: false
      force: false
    ~/.config/zed:
      recursive: false
      force: false
    ~/.local/bin: # Clean script and font installer links.
      recursive: false
      force: false
    ~/.config/sublime-text/Packages/User: # Clean Sublime Text links (Linux).
      recursive: false
      force: false
    ~/Library/Application Support/Sublime Text/Packages/User: # Clean Sublime Text links (macOS).
      recursive: false
      force: false
    ~/.local/share/konsole: # Clean Konsole colorscheme/profile links (Linux).
      recursive: false
      force: false
    ~/Library/Application Support/konsole: # Clean Konsole colorscheme/profile links (macOS).
      recursive: false
      force: false
    ~/.local/share/scripts/theme_switch.sh: # Clean Plasma theme toggle link (Linux).
      force: false

- link:
    # Shell
    ~/.bash_profile: shells/bash/.bash_profile
    ~/.bashrc: shells/bash/.bashrc
    ~/.profile: shells/.profile
    ~/.zprofile: shells/zsh/.zprofile
    ~/.zshenv: shells/zsh/.zshenv
    ~/.zshrc: shells/zsh/.zshrc

    # Git
    ~/.gitconfig: .gitconfig

    # Packages
    ~/.Brewfile:
      path: Brewfile
      if: '[ -z "$DOTFILES_SERVER" ]'

    # Prompt
    ~/.config/starship.toml: starship/starship.toml

    # OpenCode (API key comes from $LITHOSAI_API_KEY, e.g. via ~/.env)
    ~/.config/opencode/opencode.json: opencode/opencode.json
    ~/.config/opencode/cli.json: opencode/cli.json
    ~/.config/opencode/plugins: opencode/plugins

    # Neovim
    ~/.config/nvim/.stylua.toml: editors/nvim/.stylua.toml
    ~/.config/nvim/init.lua: editors/nvim/init.lua
    ~/.config/nvim/lua: editors/nvim/lua

    # Zed
    ~/.config/zed/settings.json:
      path: editors/zed/settings.json
      if: '[ -z "$DOTFILES_SERVER" ]'
    ~/.config/zed/tasks.json:
      path: editors/zed/tasks.json
      if: '[ -z "$DOTFILES_SERVER" ]'
    ~/.config/zed/themes:
      path: editors/zed/themes
      if: '[ -z "$DOTFILES_SERVER" ]'
    ~/.config/zed/keymap.json:
      path: editors/zed/keymap.json
      if: '[ -z "$DOTFILES_SERVER" ]'

    # Contour: native layout on macOS/Linux, sandbox layout on Linux Flatpak.
    ~/.config/contour/contour.yml: terminals/contour/contour.yml
    ~/.var/app/org.contourterminal.Contour/config/contour/contour.yml:
      path: terminals/contour/contour.yml
      if: "[ $(uname) = Linux ]"

    # tmux (useful on both desktops and servers)
    ~/.config/tmux/tmux.conf: terminals/tmux/tmux.conf

    # Sublime Text settings and colour schemes live in one flat User dir.
    ~/.config/sublime-text/Packages/User/:
      glob: true
      path: editors/sublime-text/*
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Linux ]"
    ~/Library/Application Support/Sublime Text/Packages/User/:
      glob: true
      path: editors/sublime-text/*
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Darwin ]"

    # Konsole colorschemes and shared profiles. Machine-local overrides live in
    # the Konsole data dir as untracked <Profile>.local.profile files that
    # inherit the shared profile via Parent=; konsolerc itself is local too.
    ~/.local/share/konsole/:
      glob: true
      path: terminals/konsole/colorschemes/*.colorscheme
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Linux ]"
    ~/.local/share/konsole/Light.profile:
      path: terminals/konsole/Light.profile
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Linux ]"
    ~/.local/share/konsole/Dark.profile:
      path: terminals/konsole/Dark.profile
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Linux ]"
    ~/Library/Application Support/konsole/:
      glob: true
      path: terminals/konsole/colorschemes/*.colorscheme
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Darwin ]"
    ~/Library/Application Support/konsole/Light.profile:
      path: terminals/konsole/Light.profile
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Darwin ]"
    ~/Library/Application Support/konsole/Dark.profile:
      path: terminals/konsole/Dark.profile
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Darwin ]"

    # Plasma light/dark toggle that keeps the KDE Flatpaks (Konsole, Kate,
    # KWrite) in step. Linked where the KDE global shortcut expects it; the
    # Flatpak D-Bus and filesystem overrides it relies on are applied below.
    ~/.local/share/scripts/theme_switch.sh:
      path: scripts/theme_switch.sh
      if: "[ -z \"$DOTFILES_SERVER\" ] && [ $(uname) = Linux ]"

    # zsh-patina
    ~/.config/zsh-patina: shells/zsh/patina

    # Coding Agents
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/keybindings.json: claude/keybindings.json
    ~/.local/bin/claude-statusline: scripts/claude-statusline.sh

# Install system-integrated packages with the native package manager
# (dotbot-unipkg plugin). Idempotent: sudo only runs when something is
# missing. Tools that touch system directories or hardware belong here
# on Linux; everything else comes from the Brewfile.
#
# Server profile (`./install --server`): headless, no Homebrew. The
# unipkg blocks below cover both profiles; the desktop-only hardware and
# the server-only CLI tools are split out accordingly.
- unipkg:
    if: '[ -z "$DOTFILES_SERVER" ]'
    install:
      - ddcutil: # monitor brightness control (hardware)
          filter: linux

- unipkg:
    - install:
        - eza:
            filter: linux
        - zsh:
            filter: linux
        - zstd: # ollama's installer needs it for extraction
            filter: linux

# Server-only CLI tools and apps installed from the native package manager
# (no Homebrew on servers).
- unipkg:
    if: '[ -n "$DOTFILES_SERVER" ]'
    install:
      - neovim:
          alt_name: nvim
          filter: linux
      - fzf:
          filter: linux
      - zoxide:
          filter: linux
      - ripgrep:
          filter: linux
      - fd:
          alt_name: fd-find
          filter: linux
      - bat:
          alt_name: batcat
          filter: linux
      - git-delta:
          filter: linux
      - jq:
          filter: linux
      - yq:
          filter: linux
      - gh:
          filter: linux
      - curl:
          filter: linux
      - unzip:
          filter: linux
      - tar:
          filter: linux
      - git:
          filter: linux
      - tmux:
          filter: linux

# Install Homebrew if missing, then apply the Brewfile (dotbot-brew plugin).
# Skipped entirely on servers: no Homebrew on a server.
- brewfile:
    if: '[ -z "$DOTFILES_SERVER" ]'
    brewfile:
      - Brewfile

- shell:
    - [
        "[ -f ~/.gitconfig.local ] || printf '# Machine-local Git overrides (identity, employer setup); loaded last by ~/.gitconfig.\\n' > ~/.gitconfig.local",
        "Seed ~/.gitconfig.local",
      ]
    # Desktop-only steps; the guard short-circuits on servers.
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-custom-iosevka-extended.sh', "Install custom Iosevka Extended"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-helvetica-now.sh', "Install HelveticaNow"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-segoe-ui.sh', "Install Segoe UI (Linux)"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-sf-pro.sh', "Install SF Pro (Linux)"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-source-code-pro.sh', "Install Source Code Pro (Linux)"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-codex.sh', "Install Codex"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-llama.sh', "Install llama.cpp"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-ollama.sh', "Install Ollama"]
    - ['[ -n "$DOTFILES_SERVER" ] || ~/.dotfiles/scripts/install-rustup.sh', "Install Rust toolchain"]
    # Both profiles.
    - ["~/.dotfiles/scripts/set-default-shell.sh", "Set default shell to zsh"]
    - ["~/.dotfiles/scripts/install-zsh-patina.sh", "Install zsh-patina"]
    - ["~/.dotfiles/scripts/install-claude-code.sh", "Install Claude Code"]
