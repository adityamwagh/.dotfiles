# Profile markers: `server: true` runs only with `./install --server`;
# `server: false` runs only on the desktop; omit it to run on both.
# The same key works per entry in link targets, shell items, unipkg packages,
# and create/clean targets.
- defaults:
    link:
      create: true
      relink: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: # Remove stale dotfile symlinks.
    ~/: # Clean top-level dotfile links.
      recursive: false # Do not scan home recursively.
      force: false # Only clean links into this repo.
    ~/.claude: # Clean Claude Code config links.
      recursive: false
      force: false
    ~/.config: # Clean direct config links.
      recursive: false # Avoid scanning app internals.
      force: false # Preserve non-dotfile broken links.
    ~/.config/opencode: # Clean OpenCode config links.
      recursive: false
      force: false
    ~/.config/contour: # Clean Contour config link (native layout).
      recursive: false
      force: false
    ~/.var/app/org.contourterminal.Contour/config/contour: # Clean Contour config link (Flatpak).
      recursive: false
      force: false
    ~/Library/Application Support/contour: # Clean Contour config link (macOS).
      recursive: false
      force: false
    ~/.config/nvim:
      recursive: false
      force: false
    ~/.config/tmux:
      recursive: false
      force: false
    ~/.config/zed:
      recursive: false
      force: false
    ~/.local/bin: # Clean script and font installer links.
      recursive: false
      force: false
    ~/.config/sublime-text/Packages/User: # Clean Sublime Text links (Linux).
      recursive: false
      force: false
    ~/Library/Application Support/Sublime Text/Packages/User: # Clean Sublime Text links (macOS).
      recursive: false
      force: false
    ~/.local/share/konsole: # Clean Konsole colorscheme/profile links (Linux).
      recursive: false
      force: false
    ~/Library/Application Support/konsole: # Clean Konsole colorscheme/profile links (macOS).
      recursive: false
      force: false
    ~/.local/share/scripts/theme_switch.sh: # Clean Plasma theme toggle link (Linux).
      force: false
    ~/.config/systemd/user: # Clean systemd user unit links.
      recursive: false
      force: false

- link:
    # Shell
    ~/.bash_profile: shells/bash/.bash_profile
    ~/.bashrc: shells/bash/.bashrc
    ~/.profile: shells/.profile
    ~/.zprofile: shells/zsh/.zprofile
    ~/.zshenv: shells/zsh/.zshenv
    ~/.zshrc: shells/zsh/.zshrc

    # Git
    ~/.gitconfig: .gitconfig

    # Packages
    ~/.Brewfile:
      server: false
      path: Brewfile

    # Prompt
    ~/.config/starship.toml: starship/starship.toml

    # OpenCode (API key comes from $LITHOSAI_API_KEY, e.g. via ~/.env)
    ~/.config/opencode/opencode.json: opencode/opencode.json
    ~/.config/opencode/cli.json: opencode/cli.json
    ~/.config/opencode/plugins: opencode/plugins
    ~/.config/opencode/themes: opencode/themes

    # LiteLLM: Claude Code runs against LithosAI models through a local proxy.
    ~/.config/litellm/claude.yaml: litellm/claude.yaml
    ~/.local/bin/lithos-claude: scripts/lithos-claude.sh

    # Neovim
    ~/.config/nvim/.stylua.toml: editors/nvim/.stylua.toml
    ~/.config/nvim/init.lua: editors/nvim/init.lua
    ~/.config/nvim/lua: editors/nvim/lua

    # Zed
    ~/.config/zed/settings.json:
      server: false
      path: editors/zed/settings.json
    ~/.config/zed/themes:
      server: false
      path: editors/zed/themes
    ~/.config/zed/keymap.json:
      server: false
      path: editors/zed/keymap.json

    # Crush keeps its config and themes in one directory.
    ~/.config/crush: crush

    # iTerm2 dynamic profile (macOS only).
    ~/Library/Application Support/iTerm2/DynamicProfiles/github.json:
      server: false
      path: terminals/iterm2/github.json
      if: "[ $(uname) = Darwin ]"

    # Contour: native layout on macOS/Linux, sandbox layout on Linux Flatpak.
    ~/.config/contour/contour.yml: terminals/contour/contour.yml
    ~/.var/app/org.contourterminal.Contour/config/contour/contour.yml:
      path: terminals/contour/contour.yml
      if: "[ $(uname) = Linux ]"

    # tmux (useful on both desktops and servers)
    ~/.config/tmux/tmux.conf: terminals/tmux/tmux.conf

    # Sublime Text settings and colour schemes live in one flat User dir.
    ~/.config/sublime-text/Packages/User/:
      server: false
      glob: true
      path: editors/sublime-text/*
      if: "[ $(uname) = Linux ]"
    ~/Library/Application Support/Sublime Text/Packages/User/:
      server: false
      glob: true
      path: editors/sublime-text/*
      if: "[ $(uname) = Darwin ]"

    # Konsole colorschemes and shared profiles. Machine-local overrides live in
    # the Konsole data dir as untracked <Profile>.local.profile files that
    # inherit the shared profile via Parent=; konsolerc itself is local too.
    ~/.local/share/konsole/:
      server: false
      glob: true
      path: terminals/konsole/colorschemes/*.colorscheme
      if: "[ $(uname) = Linux ]"
    ~/.local/share/konsole/Light.profile:
      server: false
      path: terminals/konsole/Light.profile
      if: "[ $(uname) = Linux ]"
    ~/.local/share/konsole/Dark.profile:
      server: false
      path: terminals/konsole/Dark.profile
      if: "[ $(uname) = Linux ]"
    ~/Library/Application Support/konsole/:
      server: false
      glob: true
      path: terminals/konsole/colorschemes/*.colorscheme
      if: "[ $(uname) = Darwin ]"
    ~/Library/Application Support/konsole/Light.profile:
      server: false
      path: terminals/konsole/Light.profile
      if: "[ $(uname) = Darwin ]"
    ~/Library/Application Support/konsole/Dark.profile:
      server: false
      path: terminals/konsole/Dark.profile
      if: "[ $(uname) = Darwin ]"

    # Plasma light/dark toggle that keeps the KDE Flatpaks (Konsole, Kate,
    # KWrite) in step. Linked where the KDE global shortcut expects it; the
    # Flatpak D-Bus and filesystem overrides it relies on are applied below.
    ~/.local/share/scripts/theme_switch.sh:
      server: false
      path: scripts/theme_switch.sh
      if: "[ $(uname) = Linux ]"

    # zsh-patina
    ~/.config/zsh-patina: shells/zsh/patina

    # Coding Agents
    ~/.claude/keybindings.json: claude/keybindings.json
    ~/.claude/mods: claude/mods
    ~/.local/bin/claude-statusline: scripts/claude-statusline.sh

# Install system-integrated packages with the native package manager
# (dotbot-unipkg plugin). Idempotent: sudo only runs when something is
# missing. Tools that touch system directories or hardware belong here
# on Linux; everything else comes from the Brewfile.
- unipkg:
    install:
      - ddcutil: # monitor brightness control (hardware)
          server: false
          filter: linux
      - eza:
          server: true
          filter: linux
      - zsh:
          filter: linux
      - zstd: # ollama's installer needs it for extraction
          filter: linux
      # Server-only CLI tools and apps (no Homebrew on servers).
      - neovim:
          # Desktop gets Neovim from the Brewfile (see scripts/link-brew-tools.sh);
          # servers have no Homebrew, so install it natively there.
          server: true
          alt_name: nvim
          filter: linux
      - fzf:
          server: true
          filter: linux
      - zoxide:
          server: true
          filter: linux
      - ripgrep:
          server: true
          filter: linux
      - fd:
          server: true
          alt_name: fd-find
          filter: linux
      - bat:
          server: true
          alt_name: batcat
          filter: linux
      - git-delta:
          server: true
          filter: linux
      - jq:
          server: true
          filter: linux
      - yq:
          server: true
          filter: linux
      - gh:
          # Desktop takes gh from the Brewfile; servers have no Homebrew.
          # Arch names the package github-cli.
          server: true
          alt_name: github-cli
          filter: linux
      - curl:
          filter: linux
      - unzip:
          filter: linux
      - tar:
          filter: linux
      - git:
          filter: linux
      - tmux:
          server: true
          filter: linux

# Install Homebrew if missing, then apply the Brewfile (dotbot-brew plugin).
# Skipped entirely on servers: no Homebrew on a server.
- server: false
  brewfile:
    - Brewfile

- shell:
    - [
        "[ -f ~/.gitconfig.local ] || printf '# Machine-local Git overrides (identity, employer setup); loaded last by ~/.gitconfig.\\n' > ~/.gitconfig.local",
        "Seed ~/.gitconfig.local",
      ]
    # Claude Code re-serializes its settings, so keep the tracked base separate
    # and seed the live file once; later app writes stay out of git.
    - [
        "if [ -L ~/.claude/settings.json ] && [ ! -e ~/.claude/settings.json ]; then rm ~/.claude/settings.json; fi; [ -e ~/.claude/settings.json ] || cp ~/.dotfiles/claude/settings-base.json ~/.claude/settings.json",
        "Seed ~/.claude/settings.json",
      ]
    # Desktop-only steps.
    - command: "~/.dotfiles/scripts/install-custom-iosevka-extended.sh"
      description: "Install custom Iosevka Extended"
      server: false
    - command: "~/.dotfiles/scripts/install-helvetica-now.sh"
      description: "Install HelveticaNow"
      server: false
    - command: "~/.dotfiles/scripts/install-segoe-ui.sh"
      description: "Install Segoe UI (Linux)"
      server: false
    - command: "~/.dotfiles/scripts/install-sf-pro.sh"
      description: "Install SF Pro (Linux)"
      server: false
    - command: "~/.dotfiles/scripts/install-source-code-pro.sh"
      description: "Install Source Code Pro (Linux)"
      server: false
    - command: "~/.dotfiles/scripts/patch-tex-gyre-heros.sh"
      description: "Patch TeX Gyre Heros metrics"
      server: false
    - command: "~/.dotfiles/scripts/link-brew-tools.sh"
      description: "Link Homebrew tools into /usr/local/bin"
      server: false
    - command: "~/.dotfiles/scripts/install-codex.sh"
      description: "Install Codex"
      server: false
    - command: "~/.dotfiles/scripts/install-konsole.sh"
      description: "Install Konsole (macOS)"
      server: false
    - command: "~/.dotfiles/scripts/install-llama.sh"
      description: "Install llama.cpp"
      server: false
    - command: "~/.dotfiles/scripts/install-ollama.sh"
      description: "Install Ollama"
      server: false
    - command: "~/.dotfiles/scripts/install-rustup.sh"
      description: "Install Rust toolchain"
      server: false
    # watchman ships no native Linux package; install it from Homebrew when present.
    - command: "command -v watchman >/dev/null 2>&1 || ! command -v brew >/dev/null 2>&1 || brew install watchman"
      description: "Install watchman"
      server: false
    # LiteLLM is the desktop proxy for Claude Code; servers stay CLI-only.
    - command: "~/.dotfiles/scripts/install-litellm.sh"
      description: "Install LiteLLM"
      server: false
    - command: "~/.dotfiles/scripts/enable-litellm-claude.sh"
      description: "Enable the LiteLLM proxy service"
      server: false
    # Both profiles.
    - ["~/.dotfiles/scripts/set-default-shell.sh", "Set default shell to zsh"]
    - ["~/.dotfiles/scripts/install-zsh-patina.sh", "Install zsh-patina"]
    - ["~/.dotfiles/scripts/install-claude-code.sh", "Install Claude Code"]
